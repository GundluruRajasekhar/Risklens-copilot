<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>RiskLens Copilot</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6f9;--cd:#fff;--tx:#13202e;--mu:#5d6c7b;--ac:#1d5fd1;--bd:#d9e0e8;--ok:#14804a;--wn:#b45f06;--er:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--cd:#16222f;--tx:#e8eef4;--mu:#94a5b5;--ac:#6ea3ff;--bd:#283a4b;--ok:#4cd08f;--wn:#f0a64c;--er:#ff7a7a}}
:root[data-theme="dark"]{--bg:#0e1620;--cd:#16222f;--tx:#e8eef4;--mu:#94a5b5;--ac:#6ea3ff;--bd:#283a4b;--ok:#4cd08f;--wn:#f0a64c;--er:#ff7a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:0 auto;padding:18px 14px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:22px;margin:0}.s{color:var(--mu);margin:2px 0 14px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.t{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
select,input{font:inherit;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:200px}
button{font:inherit;cursor:pointer;border-radius:18px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:7px 13px}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#fff;border-color:var(--ac);border-radius:8px}
.fl{display:flex;gap:6px;flex-wrap:wrap}.fl div{flex:1;min-width:120px;border:1px solid var(--bd);border-radius:8px;padding:6px 9px;color:var(--mu);font-size:13px}
.fl div.on{color:var(--tx);border-color:var(--ac)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--bd);white-space:nowrap}
.sev{font-weight:600}.High{color:var(--er)}.Medium{color:var(--wn)}.Low{color:var(--ok)}
.cite{border-left:3px solid var(--ac);padding:4px 10px;margin:6px 0;color:var(--mu);font-size:13px}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto;font-size:12.5px;white-space:pre-wrap}
.log{font-size:12px;color:var(--mu)}
</style></head><body><main>
<header><div><h1>RiskLens Copilot</h1><div class="s">Signal, evidence, finding, report. Synthetic data for demonstration.</div></div>
<label class="log">Role <select id="role"><option value="co">Compliance Officer</option><option value="an">Business Analyst</option></select></label></header>
<div class="cd"><div class="t">Ask a question</div><div class="row"><input id="q" placeholder="e.g. Any structuring patterns this week?"><button class="p" id="go">Ask</button></div>
<div style="margin-top:8px" id="chips"></div></div>
<div class="cd"><div class="fl" id="fl"><div>1 Signal</div><div>2 Evidence</div><div>3 Finding</div><div>4 Report</div></div></div>
<div id="out"></div>
<div class="cd"><div class="t">Audit trail</div><div class="log" id="log">No queries yet.</div></div>
<script>
const D={
aml:{k:["structur","aml","cash","suspicious","launder"],q:"Any structuring patterns this week?",
sig:{t:"AML: possible structuring",sev:"High",s:"Account ACC-4471 made 6 cash deposits of Rs 8.5-9.8 lakh in 7 days (total Rs 56.2 lakh), each just under the Rs 10 lakh reporting threshold."},
cols:["Txn","Date","Type","Amount (Rs)","Branch"],rows:[["T-90211","Oct 01","Cash deposit","9,40,000","Guntur-2"],["T-90254","Oct 02","Cash deposit","9,80,000","Guntur-2"],["T-90290","Oct 03","Cash deposit","8,90,000","Vijayawada-1"],["T-90377","Oct 04","Cash deposit","9,60,000","Guntur-2"],["T-90402","Oct 05","Cash deposit","9,20,000","Tenali-1"],["T-90455","Oct 06","Cash deposit","9,30,000","Guntur-2"]],
src:[["AML-POL-4.2 Structuring red flags","Repeated cash deposits below reporting thresholds across short windows must be escalated to the MLRO."],["AML-POL-7.1 STR filing","File a suspicious transaction report within 7 working days of concluding suspicion (verify against current FIU-IND guidance)."],["KYC profile ACC-4471","Declared occupation: small trader; expected monthly cash credits Rs 6 lakh."]],
fin:"Pattern is inconsistent with the KYC profile (9x expected cash credits) and matches AML-POL-4.2 red flags across 3 branches. Recommend escalation to MLRO and STR drafting. Human review required before filing.",conf:"0.86",
rep:"STR DRAFT: ACC-4471\nBasis: 6 cash deposits (Rs 56.2 lakh) in 6 days, each below Rs 10 lakh\nKYC mismatch: expected Rs 6 lakh/month cash credits\nPolicy refs: AML-POL-4.2, AML-POL-7.1\nEvidence: T-90211, T-90254, T-90290, T-90377, T-90402, T-90455\nStatus: PENDING MLRO APPROVAL"},
liq:{k:["lcr","liquid","hqla","outflow","basel"],q:"Is our LCR near the internal limit?",
sig:{t:"Liquidity: LCR buffer thin",sev:"Medium",s:"LCR is 108%, above the 100% regulatory minimum but below the 110% internal early-warning level. Down 9 points in 3 weeks."},
cols:["Week","HQLA (Rs cr)","Net outflows 30d (Rs cr)","LCR"],rows:[["Sep 15","1,872","1,600","117%"],["Sep 22","1,820","1,630","112%"],["Sep 29","1,790","1,650","108%"],["Oct 06","1,780","1,648","108%"]],
src:[["LIQ-POL-2.3 Early warning","Breach of 110% internal LCR triggers ALCO notification within 2 business days."],["Basel III LCR standard","LCR = stock of HQLA / total net cash outflows over 30 days, minimum 100%."],["Treasury note Oct 03","Large wholesale deposit maturity of Rs 120 cr scheduled Oct 14."]],
fin:"Internal early-warning level breached. Upcoming Rs 120 cr maturity could push LCR toward 100%. Recommend ALCO notification and a funding plan.",conf:"0.91",
rep:"ALCO NOTE\nLCR 108% vs internal trigger 110% (regulatory min 100%)\nDriver: HQLA down Rs 92 cr in 3 weeks\nRisk: Rs 120 cr maturity on Oct 14\nPolicy ref: LIQ-POL-2.3\nStatus: PENDING ALCO REVIEW"},
cr:{k:["credit","loan","npa","sma","dpd","default"],q:"Which loans show early credit deterioration?",
sig:{t:"Credit: early stress in MSME book",sev:"Medium",s:"14 MSME loans moved to SMA-1 (31-60 days overdue) this month, up from 5. Exposure Rs 38 cr."},
cols:["Loan","Segment","DPD","Exposure (Rs lakh)","Collateral cover"],rows:[["L-2210","MSME","47","310","1.1x"],["L-2288","MSME","38","420","0.9x"],["L-2301","MSME","55","275","1.3x"],["L-2356","MSME","33","560","0.8x"]],
src:[["CR-POL-3.4 Early warning","SMA-1 accounts need account review within 10 days and collateral revaluation if cover is under 1.0x."],["RBI SMA classification","SMA-1 covers principal or interest overdue 31-60 days."],["Portfolio note","Textile cluster hit by input cost rise."]],
fin:"Stress concentrated in the textile cluster; 2 of 4 sampled loans have cover below 1.0x. Recommend collateral revaluation and restructuring review.",conf:"0.82",
rep:"CREDIT WATCHLIST MEMO\n14 loans SMA-1, Rs 38 cr exposure\nConcentration: textile cluster\nAction: revalue collateral on L-2288, L-2356\nPolicy ref: CR-POL-3.4\nStatus: PENDING CREDIT COMMITTEE"}};
const $=i=>document.getElementById(i),audit=[];let n=0;
$("chips").innerHTML=Object.keys(D).map(k=>`<button data-k="${k}">${D[k].q}</button> `).join("");
function pick(t){t=t.toLowerCase();for(const k in D)if(D[k].k.some(w=>t.includes(w)))return k;return null}
function mask(s){return s.replace(/ACC-4471/g,"ACC-****")}
function run(k){const d=D[k],an=$("role").value==="an",f=[...$("fl").children];n++;const id="Q-"+String(n).padStart(3,"0");
$("out").innerHTML="";f.forEach(e=>e.classList.remove("on"));let st=0;
const steps=[()=>{f[0].classList.add("on");$("out").innerHTML=`<div class="cd"><div class="t">Signal</div><span class="sev ${d.sig.sev}">${d.sig.sev}</span> <b>${d.sig.t}</b><p>${an?mask(d.sig.s):d.sig.s}</p></div>`},
()=>{f[1].classList.add("on");$("out").innerHTML+=`<div class="cd"><div class="t">Evidence</div><div class="w"><table><tr>${d.cols.map(c=>`<th>${c}</th>`).join("")}</tr>${d.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>${d.src.map(s=>`<div class="cite"><b>${s[0]}</b><br>${s[1]}</div>`).join("")}</div>`},
()=>{f[2].classList.add("on");$("out").innerHTML+=`<div class="cd"><div class="t">Finding (confidence ${d.conf})</div><p>${an?mask(d.fin):d.fin}</p></div>`},
()=>{f[3].classList.add("on");const body=an?"Restricted: the Business Analyst role cannot view regulatory drafts. Account identifiers are masked.":d.rep;
$("out").innerHTML+=`<div class="cd"><div class="t">Report draft</div><pre>${body}</pre>${an?"":'<button class="p" id="ap">Approve and log</button>'}</div>`;
audit.unshift(`${id} | ${an?"Analyst":"Compliance"} | ${d.sig.t} | sources: ${d.src.length} | ${an?"PII masked, report blocked":"full access"}`);$("log").innerHTML=audit.map(a=>"<div>"+a+"</div>").join("");
const ap=$("ap");if(ap)ap.onclick=()=>{ap.textContent="Approved (demo)";audit[0]+=" | human approved";$("log").innerHTML=audit.map(a=>"<div>"+a+"</div>").join("")}}];
const tm=setInterval(()=>{steps[st]();st++;if(st>=steps.length)clearInterval(tm)},450)}
$("chips").onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){$("q").value=D[k].q;run(k)}};
$("go").onclick=()=>{const k=pick($("q").value);if(k)run(k);else $("out").innerHTML='<div class="cd">No matching signal in the demo data. Try structuring, LCR or SMA loans.</div>'};
$("q").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
</script></main></body></html>
